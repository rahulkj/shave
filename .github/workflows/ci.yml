name: ci

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  GO_MODULE: github.com/rahulkj/shave

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true
      - name: vet
        working-directory: go
        run: go vet ./...
      - name: gofmt
        working-directory: go
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Unformatted files: $unformatted"
            exit 1
          fi
      - name: test
        working-directory: go
        run: go test ./... -race

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, runner: ubuntu-latest }
          - { goos: linux,   goarch: arm64, runner: ubuntu-latest }
          - { goos: darwin,  goarch: amd64, runner: macos-15-intel }
          - { goos: darwin,  goarch: arm64, runner: macos-latest }
          - { goos: windows, goarch: amd64, runner: windows-latest }
          - { goos: windows, goarch: arm64, runner: windows-latest }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: build
        working-directory: go
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          OUT="shave-${GITHUB_REF_NAME#v}-${{ matrix.goos }}-${{ matrix.goarch }}"
          [ "${{ matrix.goos }}" = "windows" ] && OUT="${OUT}.exe"
          mkdir -p ../dist
          go build -trimpath \
            -ldflags "-s -w \
              -X $GO_MODULE/internal/shave.Version=${VERSION} \
              -X $GO_MODULE/internal/shave.Commit=${COMMIT} \
              -X $GO_MODULE/internal/shave.Date=${DATE}" \
            -o "../dist/${OUT}" ./cmd/shave
          if [ ! -s "../dist/${OUT}" ]; then
            echo "::error::empty or missing binary"
            exit 1
          fi
          size=$(wc -c < "../dist/${OUT}")
          echo "built ${OUT} (${size} bytes)"
          if [ "${size}" -lt 100000 ]; then
            echo "::error::binary implausibly small (${size} bytes)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: shave-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false

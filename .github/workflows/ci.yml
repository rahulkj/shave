name: ci

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true
      - working-directory: go
        run: |
          go vet ./...
          [ -z "$(gofmt -l .)" ] || { gofmt -l .; exit 1; }
          go test ./... -race
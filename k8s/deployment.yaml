apiVersion: apps/v1
kind: Deployment
metadata:
  name: shave
  labels:
    app: shave
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shave
  template:
    metadata:
      labels:
        app: shave
    spec:
      containers:
        - name: shave
          image: ghcr.io/rahulkj/shave:latest
          imagePullPolicy: IfNotPresent
          # Keep the pod alive so operators can `kubectl exec` into it
          # to run shave against cluster-internal logs/outputs.
          command: ["sh", "-c", "sleep infinity"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
